    <style>
      body {
        background-color: #1A0F1F;
        color: #FFFFFF;

      }
      /* Hide scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1A0F1F;
      }
      ::-webkit-scrollbar-thumb {
        background: #6E2A6F;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {

      .glow-text {
